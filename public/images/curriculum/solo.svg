<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 338" role="img" aria-hidden="true">
  <rect x="0" y="0" width="600" height="338" fill="#f7f7f8"/>
  <rect x="56" y="56" width="6" height="6" fill="#33373e"/>
  <line x1="60" y1="282" x2="540" y2="282" stroke="#dfe0e2" stroke-width="1"/>
  <!-- single thread, 6 evenly spaced nodes -->
  <line x1="90" y1="169" x2="510" y2="169" stroke="#3f6ea3" stroke-width="1.5"/>
  <g fill="#f7f7f8" stroke="#33373e" stroke-width="1.5">
    <circle cx="90" cy="169" r="7"/>
    <circle cx="174" cy="169" r="7"/>
    <circle cx="258" cy="169" r="7"/>
    <circle cx="342" cy="169" r="7"/>
    <circle cx="426" cy="169" r="7"/>
    <circle cx="510" cy="169" r="7"/>
  </g>
  <!-- terminal arrow -->
  <path d="M 510 169 L 528 169 M 521 162 L 528 169 L 521 176" fill="none" stroke="#33373e" stroke-width="1.5"/>
  <!-- tick marks down to baseline, marking each block -->
