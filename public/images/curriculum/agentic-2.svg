  <circle cx="390" cy="210" r="6" fill="#f7f7f8" stroke="#3f6ea3" stroke-width="1.5" stroke-dasharray="2 3"/>
  <circle cx="480" cy="169" r="7" fill="#f7f7f8" stroke="#3f6ea3" stroke-width="1.5" stroke-dasharray="2 3"/>
