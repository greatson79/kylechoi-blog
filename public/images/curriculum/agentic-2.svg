<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 338" role="img" aria-hidden="true">
  <rect x="0" y="0" width="600" height="338" fill="#f7f7f8"/>
  <rect x="56" y="56" width="6" height="6" fill="#33373e"/>
  <line x1="60" y1="282" x2="540" y2="282" stroke="#dfe0e2" stroke-width="1"/>
  <!-- expanded from the 2-node MVP into a small hub network (3-5 nodes) -->
