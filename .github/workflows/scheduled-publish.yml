name: Scheduled Publish

# 예약발행 트리거 (2026-10-01 개정 — CLI 배포 → git push 연동 배포).
#
# ★개정 사유: 9/16 이후 vercel CLI 배포가 "Your Team exceeded our fair use limits and has been blocked."로
# 34회 연속 실패했다. 같은 기간 git push 연동 배포(vercel[bot])는 정상(Production success)이었다.
# 그래서 이 워크플로는 CLI를 쓰지 않는다 — "마지막 Production 배포 이후 pubDate가 지난 글"이 있을 때만
# 빈 커밋을 main에 push해 Vercel git 연동 빌드를 깨운다(빌드 시점에 pubDate<=now 필터가 적용되므로).
# 멱등: 마지막 배포 이후 새로 도래한 글이 없으면 아무것도 하지 않는다.

on:
  schedule:
    - cron: '15 21 * * *'
    - cron: '15 0 * * *'   # pubDate 날짜-only = UTC 자정 → KST 09:00 직후 2차 발화
  workflow_dispatch: {}

permissions:
  contents: write   # 빈 커밋 push
  issues: write     # 실패 시 이슈 생성
  deployments: read

concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Find posts that became due since last production deploy
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os,re,json,subprocess,datetime as dt
          utc=dt.timezone.utc
          now=dt.datetime.now(utc)
          dep=json.loads(subprocess.check_output(['gh','api','repos/${{ github.repository }}/deployments?environment=Production&per_page=1']))
          last=dt.datetime.fromisoformat(dep[0]['created_at'].replace('Z','+00:00'))
          def pd(s):
              s=s.strip().strip('"\'')
              d=dt.datetime.fromisoformat(s.replace('Z','+00:00'))
              return d if d.tzinfo else d.replace(tzinfo=utc)
          due=[]
          for dp,_,fs in os.walk('src/content'):
              for f in fs:
                  if f.startswith('_') or not f.endswith(('.md','.mdx')): continue
                  m=re.match(r'^---\n(.*?)\n---',open(os.path.join(dp,f),encoding='utf-8').read(),re.S)
                  if not m: continue
                  fm=dict(re.findall(r'^([A-Za-z]+):\s*(.*)$',m.group(1),re.M))
                  if fm.get('draft','true').strip()!='false' or 'pubDate' not in fm: continue
                  if last < pd(fm['pubDate']) <= now: due.append(re.sub(r'\.mdx?$','',f))
          print('due='+','.join(sorted(due)))
          print('last_deploy='+last.isoformat())
          PY

      - name: Trigger Vercel git-integration build (empty commit)
        if: steps.due.outputs.due != ''
        run: |
          git config user.name  "scheduled-publish[bot]"
          git config user.email "scheduled-publish@users.noreply.github.com"
          git commit --allow-empty -m "chore(deploy): scheduled publish trigger — ${{ steps.due.outputs.due }}"
          git push origin HEAD:main

      - name: Verify live (each due slug appears in sitemap)
        if: steps.due.outputs.due != ''
        run: |
          set -uo pipefail
          for slug in $(echo "${{ steps.due.outputs.due }}" | tr ',' ' '); do
            ok=0
            for i in $(seq 1 16); do
              if curl -s "https://kylechoi.com/sitemap-0.xml" | grep -q "$slug"; then ok=1; break; fi
              sleep 15
            done
            [ "$ok" = 1 ] && echo "live: $slug" || { echo "::error::not live: $slug"; exit 1; }
          done

      - name: Notify on failure (GitHub Issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `배포 실패 — scheduled-publish run #${context.runNumber}`,
              labels: ['deploy-failure', 'urgent'],
              body: [
                `워크플로 run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `트리거: ${context.eventName}`,
                `시각(UTC): ${new Date().toISOString()}`,
              ].join('\n'),
            })
