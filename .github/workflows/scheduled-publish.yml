name: Scheduled Publish

# 예약발행 정식 배포 파이프라인 (2026-07-13, POC 실증 반영 견고화).
#
# ★로컬 launchd를 안 쓰는 이유(실측 근거): POC 1차 무인실행에서 vercel CLI가 fnm의 세션전용
# 임시 심링크 PATH로만 해석돼 launchd 환경에서 "command not found"로 조용히 실패했다
# (output/WaveAI/AI-Tech본부/_round/예약발행_POC_실측보고_2026-07-13.md §4). GitHub Actions
# 컨테이너는 매 실행마다 Node/vercel을 새로 설치하므로 이 함정 자체가 구조적으로 없다.
#
# 콘텐츠 노출 게이트(pubDate<=now, 13개 getCollection 호출부·RSS 포함)는 이미 main에 있다
# (커밋 ad4fe7d) — 이 워크플로는 "게이트를 통과한 콘텐츠를 실제로 세상에 내보내는" 배포만
# 담당한다. 멱등이라 콘텐츠 변경이 없는 날 실행돼도 무해(동일 산출물 재배포).

on:
  schedule:
    # ★실증(2026-07-13 12:21 UTC 임시조정) — 스케줄 발화 자체를 실측하기 위해 잠시 근접시각으로
    # 설정. 확인 완료 즉시 21:15 UTC(06:15 KST)로 원복한다.
    - cron: '30 12 * * *'
  workflow_dispatch: {}  # 실증(수동 1회 발화)·긴급 재배포용

permissions:
  contents: read
  issues: write  # 실패 시 이슈 생성용(아래 notify-on-failure)

concurrency:
  group: scheduled-publish
  cancel-in-progress: false  # 겹쳐 실행되면 배포 순서가 꼬일 수 있어 대기시킨다(취소 안 함)

jobs:
  deploy:
    runs-on: ubuntu-latest
    # ★codex R2 발견(2026-07-13): repo root가 이 워크플로 파일 기준 그대로다(로컬 클론 경로가
    # 우연히 "wave-education/blog"일 뿐, repo 안에 "blog/" 서브디렉토리는 없음) —
    # working-directory 지정 자체가 오류였다. 지정 없이 repo root 기준으로 실행한다.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Vercel CLI
        # ★codex R2 권고: @latest는 예약실행 중 예고없는 브레이킹체인지 리스크 — 오늘 로컬
        # 검증에 실제 쓰인 버전(POC 2차실행 로그)으로 고정.
        run: npm install --global vercel@55.0.0

      - name: Deploy to Vercel (production, with retry)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # ★agy 견고성검수 발견(2026-07-13): 로컬은 .vercel/project.json(gitignored, `vercel link`
          # 결과)이 프로젝트를 알려주지만 CI 체크아웃엔 그 파일이 없어 토큰만으로는 어느
          # 프로젝트에 배포할지 못 찾는다. org/project ID는 자격증명이 아니라 식별자라
          # Repository Variables(비밀 아님)로 등록해 주입한다.
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -uo pipefail
          MAX_ATTEMPTS=3
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "::group::배포 시도 ${attempt}/${MAX_ATTEMPTS}"
            if vercel --prod --token="$VERCEL_TOKEN" --yes; then
              echo "::endgroup::"
              echo "배포 성공 (시도 ${attempt}회째)"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::배포 시도 ${attempt} 실패"
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep $((attempt * 15))
            fi
          done
          echo "::error::배포 ${MAX_ATTEMPTS}회 전부 실패"
          exit 1

      - name: Verify live (post-deploy HTTP check)
        if: success()
        run: |
          set -uo pipefail
          URL="https://kylechoi.com/"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            echo "확인 ${i}/5 — ${URL} = HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then
              echo "verify 통과"
              exit 0
            fi
            sleep 10
          done
          echo "::error::verify 실패 — ${URL} 이 5회 시도 후에도 200이 아님"
          exit 1

      - name: Notify on failure (GitHub Issue — 조용한 실패 차단)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `배포 실패 — scheduled-publish run #${context.runNumber}`,
              labels: ['deploy-failure', 'urgent'],
              body: [
                `워크플로 run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `트리거: ${context.eventName}`,
                `시각(UTC): ${new Date().toISOString()}`,
                '',
                '재시도 3회(배포) 또는 verify 5회(HTTP 200 확인) 전부 실패했습니다.',
                'GitHub 실패 이메일과 별개로, 조용한 실패를 막기 위해 이 이슈가 자동 생성됩니다.',
              ].join('\n'),
            })
